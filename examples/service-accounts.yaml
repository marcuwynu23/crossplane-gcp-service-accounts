---
# Direct managed resource examples (no Composition required).
#
# These are the building blocks for DYNAMIC cases (any number of service
# accounts, roles, and keys). Replace PROJECT_ID with your GCP project ID and
# give each resource a unique name.
apiVersion: iam.gcp.upbound.io/v1beta1
kind: ServiceAccount
metadata:
  name: my-app-sa
spec:
  forProvider:
    project: PROJECT_ID
    displayName: My App Service Account
    description: Service account for the application
  providerConfigRef:
    name: gcp-provider-config
---
apiVersion: iam.gcp.upbound.io/v1beta1
kind: ProjectIAMMember
metadata:
  name: my-app-sa-role-run-invoker
spec:
  forProvider:
    project: PROJECT_ID
    role: roles/run.invoker
    member: serviceAccount:my-app-sa@PROJECT_ID.iam.gserviceaccount.com
  providerConfigRef:
    name: gcp-provider-config
---
apiVersion: iam.gcp.upbound.io/v1beta1
kind: ProjectIAMMember
metadata:
  name: my-app-sa-role-artifactregistry-reader
spec:
  forProvider:
    project: PROJECT_ID
    role: roles/artifactregistry.reader
    member: serviceAccount:my-app-sa@PROJECT_ID.iam.gserviceaccount.com
  providerConfigRef:
    name: gcp-provider-config
---
# The ServiceAccountKey writes connection details (including the private key
# under the "privateKey" key) to the Kubernetes Secret referenced by
# writeConnectionSecretToRef.
apiVersion: iam.gcp.upbound.io/v1beta1
kind: ServiceAccountKey
metadata:
  name: my-app-sa-key
spec:
  forProvider:
    serviceAccountId: projects/PROJECT_ID/serviceAccounts/my-app-sa@PROJECT_ID.iam.gserviceaccount.com
    publicKeyType: TYPE_X509_PEM_FILE
  writeConnectionSecretToRef:
    name: my-app-sa-key
    namespace: default
  providerConfigRef:
    name: gcp-provider-config
